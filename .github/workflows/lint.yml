name: Lint

on:
  push:
    branches: [ main ]
  # Every pull request, not only the ones targeting main: a stacked PR is based
  # on the branch below it and would otherwise get no CI at all.
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Code Quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt update
          sudo apt install -y clang-format

      - name: Run pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure
