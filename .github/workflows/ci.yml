name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build and Test GDScript Compiler

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-14-riscv64-linux-gnu g++-14-riscv64-linux-gnu cmake ninja-build

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -G Ninja

      - name: Build
        run: cmake --build build --parallel 6

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure --parallel 6

  build-release:
    runs-on: ubuntu-latest
    name: Build Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-14-riscv64-linux-gnu g++-14-riscv64-linux-gnu cmake

      - name: Configure Release
        run: |
          cmake -B build-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF

      - name: Build Release
        run: cmake --build build-release --parallel 6

      - name: Upload compiler binary
        uses: actions/upload-artifact@v4
        with:
          name: gdscript-compiler
          path: |
            build-release/src/gdscript/compiler/gdscript_compiler_test
            build-release/src/gdscript/compiler/dump_ir
            build-release/src/gdscript/compiler/gdscript_to_riscv
          if-no-files-found: warn
